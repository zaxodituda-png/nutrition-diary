<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Создание администратора</title><link rel="stylesheet" href="styles.css?v=php-1"><script src="setup.js?v=php-1" defer></script></head>
<body><main class="shell"><section class="card report"><h1>Создание администратора</h1><p class="muted">Однократная настройка. Токен создаётся владельцем в закрытой конфигурации сервера.</p><form id="setupForm"><label>Одноразовый токен <input id="setupToken" type="password" required autocomplete="off"></label><label>Логин <input id="setupUser" required minlength="3" maxlength="64" pattern="[a-zA-Z0-9_.-]+" autocomplete="username"></label><label>Пароль (12–72 байта) <input id="setupPassword" type="password" required minlength="12" maxlength="72" autocomplete="new-password"></label><div class="editor-actions"><button type="submit">Создать администратора</button></div></form><p id="setupStatus" role="status"></p><a href="./">Открыть дневник</a></section></main></body></html>
