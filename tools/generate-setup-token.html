<!doctype html><html lang="ru"><meta charset="utf-8"><title>Одноразовый токен — локальный генератор</title><h1>Локальный генератор токена</h1><p>Откройте этот файл на своём компьютере. Он не использует сеть. Сохраните токен в менеджере паролей и не отправляйте его в GitHub.</p><button id="generate">Создать токен</button><pre id="result"></pre><script>
document.getElementById('generate').onclick=async()=>{try{const bytes=crypto.getRandomValues(new Uint8Array(32));const token=Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('');const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));const hash=Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join('');document.getElementById('result').textContent=`Одноразовый токен (только для setup.html на вашем HTTPS-сайте):\n${token}\n\nsetup_token_hash (для private/config.php):\n${hash}`;}catch{document.getElementById('result').textContent='Используйте CLI-генератор private/bin/setup-token.php.';}};
</script></html>
